name: Ubuntu Cloud PC V8.3 - NoMachine (GNOME / Hyprland / XFCE)
on:
  workflow_dispatch:
    inputs:
      persist-path:
        description: "Folder in /home/Winn_core to preserve"
        required: false
        default: Persist
      max-hours:
        description: "Maximum hours to keep the Ubuntu desktop alive"
        required: false
        default: "4"
      install-wine:
        description: "Install Wine in background after NoMachine is up (true/false)"
        required: false
        default: "true"
      desktop-flavor:
        description: "Desktop: gnome (default), xfce, or hyprland"
        required: false
        default: "gnome"

env:
  RDP_USERNAME: Winn_core

jobs:
  VM-GITHUB-UBUNTU_NATIVE:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      PERSIST_REL: ${{ github.event.inputs['persist-path'] || 'Persist' }}
      MAX_HOURS: ${{ github.event.inputs['max-hours'] || '4' }}
      INSTALL_WINE: ${{ github.event.inputs['install-wine'] || 'true' }}
      DESKTOP: ${{ github.event.inputs['desktop-flavor'] || 'gnome' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================================
      # PHASE 1 — FAST PATH
      # ==================================================================
      - name: Fast install Ubuntu Desktop + NoMachine
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RDP_PASSWORD:-}" ]] || { echo "::error::RDP_PASSWORD secret missing"; exit 1; }

          # Speed: no recommends
          sudo tee /etc/apt/apt.conf.d/99-lean >/dev/null <<'EOF'
          APT::Install-Recommends "false";
          APT::Install-Suggests "false";
          Acquire::Queue-Mode "host";
          Acquire::Retries "3";
          Dir::Cache::Archives "/var/cache/apt/archives";
          EOF

          # Normalize input
          case "${DESKTOP,,}" in
            gnome|gnome-minimal|g) DESKTOP="gnome" ;;
            xfce|x)               DESKTOP="xfce" ;;
            hyprland|hypr|h)      DESKTOP="hyprland" ;;
            *)                    DESKTOP="gnome" ;;
          esac
          echo "Selected desktop: ${DESKTOP}"

          # --- Pick desktop stack ---
          case "${DESKTOP}" in
            xfce)
              DE_PKGS="xfce4 xfce4-goodies xfce4-session xfconf xfdesktop4 xfwm4 xfce4-panel \
                       xfdesktop4-data dbus-x11 dbus-user-session x11-xserver-utils xfce4-terminal thunar"
              ;;
            hyprland)
              # Add community PPA for a usable Hyprland on 24.04
              sudo add-apt-repository -y ppa:cppiber/hyprland
              sudo apt-get update -qq
              DE_PKGS="hyprland hyprland-protocols xdg-desktop-portal-hyprland \
                       kitty thunar wofi grim slurp wl-clipboard \
                       pipewire wireplumber fonts-noto fonts-font-awesome \
                       xdg-desktop-portal xdg-desktop-portal-gtk seatd"
              ;;
            *)  # gnome
              DE_PKGS="ubuntu-desktop-minimal"
              DESKTOP="gnome"
              ;;
          esac

          WANTED="${DE_PKGS} \
          curl ca-certificates wget unzip tar p7zip-full \
          xserver-xorg-video-dummy x11-xserver-utils dbus-x11"

          MISSING=""
          for pkg in ${WANTED}; do
            dpkg -s "\( {pkg}" >/dev/null 2>&1 || MISSING=" \){MISSING} ${pkg}"
          done

          echo "::group::apt install (\( {DESKTOP}) — missing: \){MISSING:- none}"
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ${MISSING}
          echo "::endgroup::"

          # --- User Setup ---
          id "\( {RDP_USERNAME}" >/dev/null 2>&1 || sudo useradd -m -s /bin/bash " \){RDP_USERNAME}"
          sudo usermod -aG sudo,audio,video,plugdev,netdev "${RDP_USERNAME}"
          echo "\( {RDP_USERNAME}: \){RDP_PASSWORD}" | sudo chpasswd
          echo "${RDP_USERNAME} ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/${RDP_USERNAME}" >/dev/null
          sudo chmod 0440 "/etc/sudoers.d/${RDP_USERNAME}"

          USER_HOME="/home/${RDP_USERNAME}"
          sudo -u "${RDP_USERNAME}" mkdir -p \
            "${USER_HOME}/Persist" \
            "${USER_HOME}/D/Programs" \
            "${USER_HOME}/D/Wine" \
            "${USER_HOME}/D/Steam" \
            "${USER_HOME}/D/Downloads" \
            "${USER_HOME}/.config"

          # XFCE failsafe seed (still useful)
          if [[ "${DESKTOP}" == "xfce" ]]; then
            sudo -u "\( {RDP_USERNAME}" mkdir -p " \){USER_HOME}/.config/xfce4/xfconf/xfce-perchannel-xml"
            sudo tee "${USER_HOME}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml" >/dev/null <<'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-session" version="1.0">
            <property name="sessions" type="empty">
              <property name="FailsafeSessionName" type="string" value="Failsafe"/>
            </property>
          </channel>
          XMLEOF
          fi

          # Minimal Hyprland config so it can start
          if [[ "${DESKTOP}" == "hyprland" ]]; then
            sudo -u "\( {RDP_USERNAME}" mkdir -p " \){USER_HOME}/.config/hypr"
            sudo -u "\( {RDP_USERNAME}" tee " \){USER_HOME}/.config/hypr/hyprland.conf" >/dev/null <<'HYPREOF'
          # Minimal config for NoMachine / headless
          monitor=,preferred,auto,1
          exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
          exec-once = /usr/libexec/xdg-desktop-portal-hyprland
          exec-once = /usr/libexec/xdg-desktop-portal
          env = XCURSOR_SIZE,24
          general {
              gaps_in = 5
              gaps_out = 10
              border_size = 2
              col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
              col.inactive_border = rgba(595959aa)
              layout = dwindle
          }
          decoration {
              rounding = 8
              blur {
                  enabled = true
                  size = 3
                  passes = 1
              }
          }
          animations {
              enabled = true
          }
          dwindle {
              pseudotile = true
              preserve_split = true
          }
          # Basic binds so it's usable
          bind = SUPER, Q, exec, kitty
          bind = SUPER, C, killactive,
          bind = SUPER, M, exit,
          bind = SUPER, E, exec, thunar
          bind = SUPER, V, togglefloating,
          bind = SUPER, R, exec, wofi --show drun
          bind = SUPER, P, pseudo,
          bind = SUPER, J, togglesplit,
          HYPREOF
          fi

          sudo ln -sfn "\( {USER_HOME}/D" " \){USER_HOME}/D_DRIVE"

          # Polkit
          sudo mkdir -p /etc/polkit-1/rules.d
          sudo tee /etc/polkit-1/rules.d/45-allow.rules >/dev/null <<'EOF'
          polkit.addRule(function(action, subject) {
            if (action.id.indexOf("org.freedesktop.color-manager.") === 0 &&
                subject.isInGroup("sudo")) {
              return polkit.Result.YES;
            }
          });
          polkit.addRule(function(action, subject) {
            if (action.id.indexOf("org.freedesktop.NetworkManager.") === 0 &&
                subject.isInGroup("sudo")) {
              return polkit.Result.YES;
            }
          });
          EOF

          # --- Install NoMachine ---
          echo "::group::Install NoMachine"
          cd /tmp
          NOMACHINE_DEB="nomachine_9.8.2_1_amd64.deb"
          wget -q "https://apt.iteas.at/iteas/pool/main/n/nomachine/\( {NOMACHINE_DEB}" -O " \){NOMACHINE_DEB}"
          sudo dpkg -i "${NOMACHINE_DEB}" || sudo apt-get install -f -y
          rm -f "${NOMACHINE_DEB}"
          echo "::endgroup::"

          sudo systemctl enable nxserver
          sudo systemctl start nxserver || true

          # Unattended access
          if [[ -f /usr/NX/etc/server.cfg ]]; then
            sudo sed -i 's/#PhysicalDesktopAuthorization 1/PhysicalDesktopAuthorization 0/' /usr/NX/etc/server.cfg
            sudo sed -i 's/PhysicalDesktopAuthorization 1/PhysicalDesktopAuthorization 0/' /usr/NX/etc/server.cfg
            sudo sed -i 's/#VirtualDesktopAuthorization 1/VirtualDesktopAuthorization 0/' /usr/NX/etc/server.cfg
            sudo sed -i 's/VirtualDesktopAuthorization 1/VirtualDesktopAuthorization 0/' /usr/NX/etc/server.cfg
          fi

          # Tell NoMachine how to start the chosen desktop (especially useful for Hyprland)
          if [[ -f /usr/NX/etc/node.cfg ]]; then
            case "${DESKTOP}" in
              hyprland)
                sudo sed -i 's|^#DefaultDesktopCommand.*|DefaultDesktopCommand "Hyprland"|' /usr/NX/etc/node.cfg || true
                sudo sed -i 's|^DefaultDesktopCommand.*|DefaultDesktopCommand "Hyprland"|' /usr/NX/etc/node.cfg || true
                ;;
              xfce)
                sudo sed -i 's|^#DefaultDesktopCommand.*|DefaultDesktopCommand "startxfce4"|' /usr/NX/etc/node.cfg || true
                sudo sed -i 's|^DefaultDesktopCommand.*|DefaultDesktopCommand "startxfce4"|' /usr/NX/etc/node.cfg || true
                ;;
              gnome)
                sudo sed -i 's|^#DefaultDesktopCommand.*|DefaultDesktopCommand "gnome-session"|' /usr/NX/etc/node.cfg || true
                sudo sed -i 's|^DefaultDesktopCommand.*|DefaultDesktopCommand "gnome-session"|' /usr/NX/etc/node.cfg || true
                ;;
            esac
          fi

          sudo /usr/NX/bin/nxserver --restart || sudo systemctl restart nxserver || true
          sudo loginctl enable-linger "${RDP_USERNAME}" || true
          sudo chown -R "\( {RDP_USERNAME}: \){RDP_USERNAME}" "${USER_HOME}"
          echo "Desktop (${DESKTOP}) + NoMachine setup complete."

      # ... (Tailscale, tuning, diagnose, connection info, Wine, keep-alive, artifacts stay the same)
