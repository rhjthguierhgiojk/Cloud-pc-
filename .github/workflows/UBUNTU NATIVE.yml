name: Ubuntu Cloud PC V3

on:
  workflow_dispatch:
    inputs:
      persist-path:
        description: "Folder in /home/Winn_core to preserve"
        required: false
        default: Persist
      max-hours:
        description: "Maximum hours to keep the Ubuntu desktop alive"
        required: false
        default: "4"

jobs:
  VM-GITHUB-UBUNTU_NATIVE:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_USERNAME: Winn_core
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      PERSIST_REL: ${{ github.event.inputs['persist-path'] || 'Persist' }}
      MAX_HOURS: ${{ github.event.inputs['max-hours'] || '4' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Ubuntu desktop (fixed Plasma X11 package)
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RDP_PASSWORD:-}" ]]; then
            echo "::error::RDP_PASSWORD secret is missing"
            exit 1
          fi

          echo "Updating Ubuntu package indexes..."
          sudo apt-get update

          echo "Installing KDE Plasma, XRDP, Wine, Steam dependencies and utilities..."
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            plasma-desktop \
            plasma-session-x11 \
            kde-config-sddm \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            policykit-1 \
            network-manager \
            curl \
            wget \
            git \
            unzip \
            tar \
            p7zip-full \
            firewalld \
            pipewire \
            pipewire-pulse \
            wireplumber \
            wine \
            winetricks \
            cabextract \
            fuse3 \
            mesa-vulkan-drivers \
            mesa-utils \
            software-properties-common \
            ca-certificates

          # Create the desktop user if the runner image does not already have it.
          if id "${RDP_USERNAME}" >/dev/null 2>&1; then
            echo "User ${RDP_USERNAME} already exists."
          else
            sudo useradd -m -s /bin/bash "${RDP_USERNAME}"
            sudo usermod -aG sudo,audio,video,plugdev "${RDP_USERNAME}"
          fi

          echo "${RDP_USERNAME}:${RDP_PASSWORD}" | sudo chpasswd
          sudo usermod -aG sudo,audio,video,plugdev "${RDP_USERNAME}"
          sudo mkdir -p "/home/${RDP_USERNAME}/Persist"
          sudo chown -R "${RDP_USERNAME}:${RDP_USERNAME}" "/home/${RDP_USERNAME}"

          # Passwordless sudo is useful for the temporary cloud-PC session.
          echo "${RDP_USERNAME} ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/${RDP_USERNAME}" >/dev/null
          sudo chmod 0440 "/etc/sudoers.d/${RDP_USERNAME}"

          # Make KDE the XRDP session.
          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          export XDG_CURRENT_DESKTOP=KDE
          export XDG_SESSION_DESKTOP=KDE
          export DESKTOP_SESSION=plasma
          export KDE_SESSION_VERSION=6
          unset DBUS_SESSION_BUS_ADDRESS
          exec dbus-run-session -- startplasma-x11
          EOF
          sudo chmod 0755 /etc/xrdp/startwm.sh

          sudo systemctl enable --now NetworkManager || true
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp

          echo "Ubuntu desktop base setup complete."

      - name: Prepare persistent folders and DDLC wallpaper
        shell: bash
        run: |
          set -euo pipefail

          USER_HOME="/home/${RDP_USERNAME}"
          PERSIST_DIR="${USER_HOME}/${PERSIST_REL}"

          sudo mkdir -p \
            "${PERSIST_DIR}" \
            "${USER_HOME}/D/Programs" \
            "${USER_HOME}/D/Wine" \
            "${USER_HOME}/D/Steam" \
            "${USER_HOME}/D/Downloads"

          sudo chown -R "${RDP_USERNAME}:${RDP_USERNAME}" \
            "${USER_HOME}/D" "${PERSIST_DIR}"

          # Keep the old D: concept, but use a normal directory on the native runner.
          sudo ln -sfn "${USER_HOME}/D" "${USER_HOME}/D_DRIVE"
          sudo chown -h "${RDP_USERNAME}:${RDP_USERNAME}" "${USER_HOME}/D_DRIVE"

          theme=".github/workflows/ddlc theme v1.deskthemepack"
          rm -rf ddlc-extract ddlc-wallpaper.bin
          mkdir -p ddlc-extract

          if [[ -f "$theme" ]]; then
            echo "Found DDLC theme package."
            7z x -y "$theme" -oddlc-extract >/dev/null || true

            wallpaper="$(find ddlc-extract -type f \
              \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) \
              | head -n1 || true)"

            if [[ -n "$wallpaper" ]]; then
              sudo cp "$wallpaper" "${USER_HOME}/.ddlc-wallpaper"
              sudo chown "${RDP_USERNAME}:${RDP_USERNAME}" "${USER_HOME}/.ddlc-wallpaper"
              sudo chmod 0644 "${USER_HOME}/.ddlc-wallpaper"
              echo "Using wallpaper: $wallpaper"
            else
              echo "No image found inside theme package."
            fi
          else
            echo "No DDLC theme package present - skipping."
          fi

      - name: Configure Wine and Steam
        shell: bash
        run: |
          set -euo pipefail

          USER_HOME="/home/${RDP_USERNAME}"
          WINEPREFIX="${USER_HOME}/D/Wine"

          sudo install -d -o "${RDP_USERNAME}" -g "${RDP_USERNAME}" "$WINEPREFIX"

          echo "Initializing Wine prefix..."
          sudo -u "${RDP_USERNAME}" env \
            HOME="${USER_HOME}" \
            WINEPREFIX="$WINEPREFIX" \
            timeout 120s wineboot -u || true

          echo "Installing Wine core fonts..."
          sudo -u "${RDP_USERNAME}" env \
            HOME="${USER_HOME}" \
            WINEPREFIX="$WINEPREFIX" \
            timeout 180s winetricks -q corefonts || true

          sudo ln -sfn "$WINEPREFIX" "${USER_HOME}/.wine"
          sudo chown -h "${RDP_USERNAME}:${RDP_USERNAME}" "${USER_HOME}/.wine"

          # Steam is available through Ubuntu's repositories on the runner.
          echo "Enabling 32-bit architecture and installing Steam if available..."
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y steam-installer || \
            echo "Steam installer package was unavailable; continuing with Wine/desktop setup."

          echo "Wine/Steam setup finished."

      - name: Configure KDE session
        shell: bash
        run: |
          set -euo pipefail

          USER_HOME="/home/${RDP_USERNAME}"

          sudo -u "${RDP_USERNAME}" \
            dbus-run-session kwriteconfig6 \
              --file "${USER_HOME}/.config/kdeglobals" \
              --group KDE --key SingleClick false || true

          sudo -u "${RDP_USERNAME}" \
            dbus-run-session kwriteconfig6 \
              --file "${USER_HOME}/.config/kwinrc" \
              --group Compositing --key Enabled true || true

          if [[ -f "${USER_HOME}/.ddlc-wallpaper" ]]; then
            sudo -u "${RDP_USERNAME}" mkdir -p "${USER_HOME}/.config"
            echo "DDLC wallpaper is ready at ${USER_HOME}/.ddlc-wallpaper"
          fi

          sudo loginctl enable-linger "${RDP_USERNAME}" || true
          sudo systemctl restart xrdp

          echo "KDE session configured."

      - name: Configure Tailscale
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TAILSCALE_AUTH_KEY:-}" ]]; then
            echo "::error::TAILSCALE_AUTH_KEY secret is missing"
            exit 1
          fi

          if ! command -v tailscale >/dev/null 2>&1; then
            echo "Installing Tailscale..."
            if ! timeout 180s bash -c 'curl -fsSL https://tailscale.com/install.sh | sh'; then
              echo "::error::Tailscale installation timed out or failed"
              exit 1
            fi
          fi

          sudo systemctl enable --now tailscaled

          TS_UP_OK=false
          for attempt in 1 2 3; do
            echo "Tailscale authentication attempt ${attempt}/3..."
            if sudo timeout 90s tailscale up \
              --auth-key="${TAILSCALE_AUTH_KEY}" \
              --hostname="ubuntu-gh-${GITHUB_RUN_ID}" \
              --accept-dns=false \
              --timeout=75s; then
              TS_UP_OK=true
              break
            fi

            echo "Tailscale attempt ${attempt} failed; retrying in 5s..."
            sleep 5
          done

          if [[ "${TS_UP_OK}" != true ]]; then
            echo "::error::Tailscale did not become ready after 3 attempts"
            sudo tailscale status || true
            sudo systemctl status tailscaled --no-pager || true
            exit 1
          fi

          TS_IP="$(sudo tailscale ip -4 | head -n1 || true)"
          echo "Tailscale IPv4: ${TS_IP}"

          echo "TAILSCALE_IP=${TS_IP}" >> "${GITHUB_ENV}"
          printf '%s\n' "${TS_IP}" | sudo tee "/home/${RDP_USERNAME}/TAILSCALE_IP.txt" >/dev/null
          sudo chown "${RDP_USERNAME}:${RDP_USERNAME}" "/home/${RDP_USERNAME}/TAILSCALE_IP.txt"

      - name: Connection info
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "  Ubuntu Cloud PC is ready"
          echo "========================================"
          echo "OS        : Ubuntu 24.04"
          echo "Desktop   : KDE Plasma (X11)"
          echo "Remote    : xrdp on port 3389"
          echo "User      : ${RDP_USERNAME}"
          echo "Tailscale : ${TAILSCALE_IP:-not found}"
          echo ""
          echo "Storage:"
          echo "  D:      -> /home/${RDP_USERNAME}/D"
          echo "  Persist -> /home/${RDP_USERNAME}/${PERSIST_REL}"
          echo ""
          echo "Connect using the Tailscale IP above with an RDP client."
          echo "========================================"

      - name: Keep Ubuntu runner alive
        shell: bash
        run: |
          set -euo pipefail

          MAX_SECONDS=$(( ${MAX_HOURS} * 3600 ))
          START=$(date +%s)

          echo "Keeping Ubuntu desktop alive for up to ${MAX_HOURS} hour(s)."
          echo "Create STOP_WORKFLOW.txt in the workspace to stop early."

          while true; do
            if [[ -f STOP_WORKFLOW.txt ]]; then
              echo "STOP_WORKFLOW.txt detected - stopping early."
              break
            fi

            if ! systemctl is-active --quiet xrdp; then
              echo "XRDP is not active; attempting restart..."
              sudo systemctl restart xrdp || true
            fi

            NOW=$(date +%s)
            if (( NOW - START >= MAX_SECONDS )); then
              echo "Maximum runtime (${MAX_HOURS}h) reached."
              break
            fi

            echo "Ubuntu Cloud PC alive - $(( (NOW - START) / 60 )) minute(s) elapsed."
            sleep 60
          done

      - name: Save session info
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p backup

          if [[ -f "/home/${RDP_USERNAME}/TAILSCALE_IP.txt" ]]; then
            cp "/home/${RDP_USERNAME}/TAILSCALE_IP.txt" backup/
          fi

          if [[ -d "/home/${RDP_USERNAME}/${PERSIST_REL}" ]]; then
            tar -czf backup/persist.tar.gz \
              -C "/home/${RDP_USERNAME}" "${PERSIST_REL}" 2>/dev/null || true
          fi

          dpkg-query -W -f='${binary:Package}\t${Version}\n' \
            > backup/installed-packages.txt 2>/dev/null || true

          tailscale status > backup/tailscale-status.txt 2>&1 || true
          systemctl status xrdp --no-pager > backup/xrdp-status.txt 2>&1 || true

          ls -lh backup/ || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-cloud-pc-${{ github.run_id }}
          path: backup/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf ddlc-extract ddlc-wallpaper.bin
          sudo systemctl stop xrdp 2>/dev/null || true
          sudo systemctl stop tailscaled 2>/dev/null || true
