name: Ubuntu Cloud PC V4 - FAST BOOT

on:
  workflow_dispatch:
    inputs:
      persist-path:
        description: "Folder in /home/Winn_core to preserve"
        required: false
        default: Persist
      max-hours:
        description: "Maximum hours to keep the Ubuntu desktop alive"
        required: false
        default: "4"

jobs:
  VM-GITHUB-UBUNTU_NATIVE:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_USERNAME: Winn_core
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      PERSIST_REL: ${{ github.event.inputs['persist-path'] || 'Persist' }}
      MAX_HOURS: ${{ github.event.inputs['max-hours'] || '4' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # FAST PATH: only install what is needed to get a usable KDE/XRDP
      # desktop online. Wine/Steam are intentionally NOT installed here.
      - name: Fast install KDE + XRDP
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RDP_PASSWORD:-}" ]]; then
            echo "::error::RDP_PASSWORD secret is missing"
            exit 1
          fi

          echo "Updating package indexes..."
          sudo apt-get update

          echo "Installing minimal KDE/X11 + XRDP stack..."
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            plasma-desktop \
            kwin-x11 \
            xrdp \
            xorgxrdp \
            pipewire \
            pipewire-pulse \
            pipewire-module-xrdp \
            mesa-vulkan-drivers \
            mesa-utils \
            vulkan-tools \
            dbus-x11 \
            curl \
            ca-certificates \
            wget \
            unzip \
            tar \
            p7zip-full

          if id "${RDP_USERNAME}" >/dev/null 2>&1; then
            echo "User ${RDP_USERNAME} already exists."
          else
            sudo useradd -m -s /bin/bash "${RDP_USERNAME}"
          fi

          sudo usermod -aG sudo,audio,video,plugdev "${RDP_USERNAME}"
          echo "${RDP_USERNAME}:${RDP_PASSWORD}" | sudo chpasswd

          echo "${RDP_USERNAME} ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/${RDP_USERNAME}" >/dev/null
          sudo chmod 0440 "/etc/sudoers.d/${RDP_USERNAME}"

          USER_HOME="/home/${RDP_USERNAME}"
          sudo mkdir -p \
            "${USER_HOME}/Persist" \
            "${USER_HOME}/D/Programs" \
            "${USER_HOME}/D/Wine" \
            "${USER_HOME}/D/Steam" \
            "${USER_HOME}/D/Downloads"

          sudo chown -R "${RDP_USERNAME}:${RDP_USERNAME}" "${USER_HOME}"

          # XRDP -> KDE Plasma X11
          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          export XDG_CURRENT_DESKTOP=KDE
          export XDG_SESSION_DESKTOP=KDE
          export DESKTOP_SESSION=plasma
          export KDE_SESSION_VERSION=6
          unset DBUS_SESSION_BUS_ADDRESS
          exec dbus-run-session -- startplasma-x11
          EOF
          sudo chmod 0755 /etc/xrdp/startwm.sh

          sudo ln -sfn "${USER_HOME}/D" "${USER_HOME}/D_DRIVE"
          sudo chown -h "${RDP_USERNAME}:${RDP_USERNAME}" "${USER_HOME}/D_DRIVE"

          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp

          # Prepare PipeWire/PulseAudio for RDP audio redirection.
          # The RDP virtual audio sink is created by pipewire-module-xrdp
          # when the XRDP session starts.
          sudo -u "${RDP_USERNAME}" mkdir -p "${USER_HOME}/.config/pipewire/pipewire.conf.d"
          sudo loginctl enable-linger "${RDP_USERNAME}" || true

          sudo systemctl restart xrdp

          echo "Fast KDE/XRDP setup complete."

      - name: Configure KDE session
        shell: bash
        run: |
          set -euo pipefail
          USER_HOME="/home/${RDP_USERNAME}"

          sudo -u "${RDP_USERNAME}" mkdir -p "${USER_HOME}/.config"

          sudo -u "${RDP_USERNAME}" \
            dbus-run-session kwriteconfig6 \
              --file "${USER_HOME}/.config/kdeglobals" \
              --group KDE --key SingleClick false || true

          sudo systemctl restart xrdp

          echo "KDE session configured."

      - name: Configure Tailscale
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TAILSCALE_AUTH_KEY:-}" ]]; then
            echo "::error::TAILSCALE_AUTH_KEY secret is missing"
            exit 1
          fi

          if ! command -v tailscale >/dev/null 2>&1; then
            echo "Installing Tailscale..."
            timeout 180s bash -c 'curl -fsSL https://tailscale.com/install.sh | sh'
          fi

          sudo systemctl enable --now tailscaled

          TS_UP_OK=false
          for attempt in 1 2 3; do
            echo "Tailscale authentication attempt ${attempt}/3..."
            if sudo timeout 90s tailscale up \
              --auth-key="${TAILSCALE_AUTH_KEY}" \
              --hostname="ubuntu-gh-${GITHUB_RUN_ID}" \
              --accept-dns=false \
              --timeout=75s; then
              TS_UP_OK=true
              break
            fi

            echo "Tailscale attempt ${attempt} failed; retrying in 5s..."
            sleep 5
          done

          if [[ "${TS_UP_OK}" != true ]]; then
            echo "::error::Tailscale did not become ready"
            sudo tailscale status || true
            sudo systemctl status tailscaled --no-pager || true
            exit 1
          fi

          TS_IP="$(sudo tailscale ip -4 | head -n1 || true)"
          if [[ -z "${TS_IP}" ]]; then
            echo "::error::Tailscale connected but no IPv4 address was returned"
            exit 1
          fi

          echo "Tailscale IPv4: ${TS_IP}"
          echo "TAILSCALE_IP=${TS_IP}" >> "${GITHUB_ENV}"

          sudo mkdir -p "/home/${RDP_USERNAME}"
          printf '%s\n' "${TS_IP}" | \
            sudo tee "/home/${RDP_USERNAME}/TAILSCALE_IP.txt" >/dev/null
          sudo chown "${RDP_USERNAME}:${RDP_USERNAME}" \
            "/home/${RDP_USERNAME}/TAILSCALE_IP.txt"

      - name: Diagnose XRDP and network
        shell: bash
        run: |
          set +e

          echo "===== XRDP SERVICE ====="
          sudo systemctl status xrdp --no-pager || true

          echo "===== TCP 3389 ====="
          sudo ss -lntp | grep ':3389' || \
            echo "ERROR: Nothing is listening on TCP 3389"

          echo "===== LOCAL RDP TEST ====="
          if timeout 5 bash -c '</dev/tcp/127.0.0.1/3389' 2>/dev/null; then
            echo "OK: TCP 3389 is reachable locally"
          else
            echo "ERROR: TCP 3389 is NOT reachable locally"
          fi

          echo "===== XRDP LOG ====="
          sudo journalctl -u xrdp --no-pager -n 40 || true

          echo "===== TAILSCALE ====="
          sudo tailscale status || true

          echo "===== FIREWALL ====="
          sudo ufw status verbose 2>/dev/null || true

      # Connection is available BEFORE any Wine/Steam work.
      - name: Setup DXVK + Vulkan software rendering
        shell: bash
        run: |
          set -e
          echo "=== Vulkan devices ==="
          vulkaninfo --summary 2>&1 || true

          echo "=== OpenGL renderer ==="
          glxinfo -B 2>&1 || true

          # DXVK translates Direct3D 9/10/11 to Vulkan.
          sudo apt-get update -qq
          sudo apt-get install -y dxvk 2>/dev/null || true

          echo "=== DXVK package ==="
          dpkg -l | grep -E '^ii[[:space:]]+dxvk([[:space:]]|$)' || true

          echo "=== Vulkan ICDs ==="
          ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || true

          echo "=== CPU Vulkan (Lavapipe) check ==="
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json             vulkaninfo --summary 2>&1 || true

      - name: Connection info
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       UBUNTU CLOUD PC READY"
          echo "========================================"
          echo "OS        : Ubuntu 24.04"
          echo "Desktop   : KDE Plasma (X11)"
          echo "Remote    : XRDP on port 3389"
          echo "Audio     : RDP audio redirection (PipeWire)"
          echo "User      : ${RDP_USERNAME}"
          echo "Tailscale : ${TAILSCALE_IP:-not found}"
          echo ""
          echo "RDP address:"
          echo "  ${TAILSCALE_IP:-not-found}:3389"
          echo ""
          echo "Wine/Steam:"
          echo "  NOT installed during boot (fast-start mode)"
          echo ""
          echo "Storage:"
          echo "  D:      -> /home/${RDP_USERNAME}/D"
          echo "  Persist -> /home/${RDP_USERNAME}/${PERSIST_REL}"
          echo "========================================"

      # Optional setup runs AFTER the connection information is available.
      # It does not block the first RDP connection.
      - name: Optional Wine setup (background)
        shell: bash
        run: |
          set +e

          USER_HOME="/home/${RDP_USERNAME}"
          WINEPREFIX="${USER_HOME}/D/Wine"

          (
            echo "Starting optional Wine setup in background..."
            sudo DEBIAN_FRONTEND=noninteractive dpkg --add-architecture i386
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              wine winetricks cabextract mesa-vulkan-drivers mesa-utils || true

            sudo install -d -o "${RDP_USERNAME}" -g "${RDP_USERNAME}" "$WINEPREFIX"

            sudo -u "${RDP_USERNAME}" env \
              HOME="${USER_HOME}" \
              WINEPREFIX="$WINEPREFIX" \
              timeout 120s wineboot -u || true

            sudo ln -sfn "$WINEPREFIX" "${USER_HOME}/.wine"
            sudo chown -h "${RDP_USERNAME}:${RDP_USERNAME}" "${USER_HOME}/.wine"

            echo "Optional Wine setup finished."
          ) > "${USER_HOME}/wine-setup.log" 2>&1 &

          echo "Wine setup started in background."
          echo "Log: ${USER_HOME}/wine-setup.log"

      - name: Keep Ubuntu runner alive
        shell: bash
        run: |
          set -euo pipefail

          MAX_SECONDS=$(( MAX_HOURS * 3600 ))
          START=$(date +%s)

          echo "Keeping Ubuntu desktop alive for up to ${MAX_HOURS} hour(s)."
          echo "Create STOP_WORKFLOW.txt in the workspace to stop early."

          while true; do
            if [[ -f STOP_WORKFLOW.txt ]]; then
              echo "STOP_WORKFLOW.txt detected - stopping early."
              break
            fi

            if ! systemctl is-active --quiet xrdp; then
              echo "XRDP is not active; attempting restart..."
              sudo systemctl restart xrdp || true
            fi

            NOW=$(date +%s)
            if (( NOW - START >= MAX_SECONDS )); then
              echo "Maximum runtime (${MAX_HOURS}h) reached."
              break
            fi

            echo "Ubuntu Cloud PC alive - $(( (NOW - START) / 60 )) minute(s) elapsed."
            sleep 60
          done

      - name: Save session info
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p backup

          [[ -f "/home/${RDP_USERNAME}/TAILSCALE_IP.txt" ]] && \
            cp "/home/${RDP_USERNAME}/TAILSCALE_IP.txt" backup/

          [[ -f "/home/${RDP_USERNAME}/wine-setup.log" ]] && \
            cp "/home/${RDP_USERNAME}/wine-setup.log" backup/

          if [[ -d "/home/${RDP_USERNAME}/${PERSIST_REL}" ]]; then
            tar -czf backup/persist.tar.gz \
              -C "/home/${RDP_USERNAME}" "${PERSIST_REL}" 2>/dev/null || true
          fi

          dpkg-query -W -f='${binary:Package}\t${Version}\n' \
            > backup/installed-packages.txt 2>/dev/null || true

          sudo tailscale status > backup/tailscale-status.txt 2>&1 || true
          sudo systemctl status xrdp --no-pager > backup/xrdp-status.txt 2>&1 || true

          ls -lh backup/ || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-cloud-pc-${{ github.run_id }}
          path: backup/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          sudo systemctl stop xrdp 2>/dev/null || true
          sudo systemctl stop tailscaled 2>/dev/null || true
