name: Ubuntu Cloud PC V8.2 - XFCE failsafe fix

on:
  workflow_dispatch:
    inputs:
      persist-path:
        description: "Folder in /home/Winn_core to preserve"
        required: false
        default: Persist
      max-hours:
        description: "Maximum hours to keep the Ubuntu desktop alive"
        required: false
        default: "4"
      install-wine:
        description: "Install Wine in background after RDP is up (true/false)"
        required: false
        default: "true"
      desktop-flavor:
        description: "Desktop: gnome-minimal (default), xfce, or lxqt"
        required: false
        default: "gnome-minimal"

env:
  RDP_USERNAME: Winn_core

jobs:
  VM-GITHUB-UBUNTU_NATIVE:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      PERSIST_REL: ${{ github.event.inputs['persist-path'] || 'Persist' }}
      MAX_HOURS: ${{ github.event.inputs['max-hours'] || '4' }}
      INSTALL_WINE: ${{ github.event.inputs['install-wine'] || 'true' }}
      DESKTOP: ${{ github.event.inputs['desktop-flavor'] || 'gnome-minimal' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================================
      # PHASE 1 — FAST PATH: get Ubuntu Desktop + XRDP + Tailscale online
      # as fast as possible. No recommends, no snaps, no extras.
      # ==================================================================
      - name: Fast install Ubuntu Desktop + XRDP
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${RDP_PASSWORD:-}" ]] || { echo "::error::RDP_PASSWORD secret missing"; exit 1; }

          # Speed: no recommends, parallel downloads, keep it lean.
          sudo tee /etc/apt/apt.conf.d/99-lean >/dev/null <<'EOF'
          APT::Install-Recommends "false";
          APT::Install-Suggests "false";
          Acquire::Queue-Mode "host";
          Acquire::Retries "3";
          Dir::Cache::Archives "/var/cache/apt/archives";
          EOF

          # --- Pick desktop stack by flavor (GitHub runner has NO desktop
          #     preinstalled; we install the smallest viable set) ---
          case "${DESKTOP}" in
            xfce)      DE_PKGS="xfce4 xfce4-goodies xfce4-session xfconf xfdesktop4 xfwm4 xfce4-panel xfdesktop4-data dbus-x11 xfce4-terminal thunar" ;;
            lxqt)      DE_PKGS="lxqt-core qterminal dbus-x11" ;;
            *)         DE_PKGS="ubuntu-desktop-minimal" ; DESKTOP="gnome-minimal" ;;
          esac

          # --- Skip packages already present on the runner image ---
          WANTED="${DE_PKGS} xrdp xorgxrdp pipewire pipewire-pulse \
            pipewire-module-xrdp wireplumber \
            curl ca-certificates wget unzip tar p7zip-full"
          MISSING=""
          for pkg in ${WANTED}; do
            dpkg -s "${pkg}" >/dev/null 2>&1 || MISSING="${MISSING} ${pkg}"
          done

          echo "::group::apt install (${DESKTOP}) — missing:${MISSING:- none}"
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ${MISSING}
          echo "::endgroup::"

          # --- user (idempotent) ---
          id "${RDP_USERNAME}" >/dev/null 2>&1 || sudo useradd -m -s /bin/bash "${RDP_USERNAME}"
          sudo usermod -aG sudo,audio,video,plugdev,netdev "${RDP_USERNAME}"
          echo "${RDP_USERNAME}:${RDP_PASSWORD}" | sudo chpasswd
          echo "${RDP_USERNAME} ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/${RDP_USERNAME}" >/dev/null
          sudo chmod 0440 "/etc/sudoers.d/${RDP_USERNAME}"

          USER_HOME="/home/${RDP_USERNAME}"
          sudo -u "${RDP_USERNAME}" mkdir -p \
            "${USER_HOME}/Persist" \
            "${USER_HOME}/D/Programs" \
            "${USER_HOME}/D/Wine" \
            "${USER_HOME}/D/Steam" \
            "${USER_HOME}/D/Downloads" \
            "${USER_HOME}/.config"

          # --- XRDP session script (flavor-aware) ---
          case "${DESKTOP}" in
            xfce) STARTWM='startxfce4' ;;
            lxqt) STARTWM='startlxqt' ;;
            *)    STARTWM='gnome-session --session=ubuntu' ;;
          esac

          sudo tee /etc/xrdp/startwm.sh >/dev/null <<EOF
          #!/bin/sh
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          export XDG_SESSION_TYPE=x11
          unset DBUS_SESSION_BUS_ADDRESS
          unset WAYLAND_DISPLAY
          case "${DESKTOP}" in
            gnome-minimal)
              export XDG_CURRENT_DESKTOP=GNOME
              export XDG_SESSION_DESKTOP=ubuntu
              export DESKTOP_SESSION=ubuntu
              export GNOME_SHELL_SESSION_MODE=ubuntu
              exec dbus-run-session -- gnome-session --session=ubuntu
              ;;
            xfce)
              export XDG_CURRENT_DESKTOP=XFCE
              export XDG_SESSION_DESKTOP=xfce
              export DESKTOP_SESSION=xfce
              export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
              export XDG_DATA_DIRS=/usr/local/share:/usr/share:/usr/share/xfce4
              # Classic, XRDP-safe launch (dbus-launch from dbus-x11).
              # dbus-run-session breaks xfconfd activation on bare XRDP sessions.
              if command -v dbus-launch >/dev/null 2>&1; then
                exec dbus-launch --exit-with-session startxfce4
              else
                exec startxfce4
              fi
              ;;
            lxqt)
              export XDG_CURRENT_DESKTOP=LXQt
              export XDG_SESSION_DESKTOP=lxqt
              export DESKTOP_SESSION=lxqt
              exec dbus-run-session -- startlxqt
              ;;
          esac
          EOF
          sudo chmod 0755 /etc/xrdp/startwm.sh

          sudo ln -sfn "${USER_HOME}/D" "${USER_HOME}/D_DRIVE"

          # --- polkit JS rules: skip colord/network dialogs on RDP login ---
          # (Ubuntu 24.04 has no localauthority/50-local.d dir; rules.d always exists)
          sudo mkdir -p /etc/polkit-1/rules.d
          sudo tee /etc/polkit-1/rules.d/45-xrdp.rules >/dev/null <<'EOF'
          polkit.addRule(function(action, subject) {
              if (action.id.indexOf("org.freedesktop.color-manager.") === 0 &&
                  subject.isInGroup("sudo")) {
                  return polkit.Result.YES;
              }
          });
          polkit.addRule(function(action, subject) {
              if (action.id.indexOf("org.freedesktop.NetworkManager.") === 0 &&
                  subject.isInGroup("sudo")) {
                  return polkit.Result.YES;
              }
          });
          EOF

          # --- XRDP tuning: low bpp + sane security, single-session reconnect ---
          sudo sed -i \
            -e '/^max_bpp=/d' -e '/^xserverbpp=/d' \
            -e '/^security_layer=/d' -e '/^crypt_level=/d' \
            -e '/^\[Globals\]/a max_bpp=16\nxserverbpp=16\nsecurity_layer=negotiate\ncrypt_level=high' \
            /etc/xrdp/xrdp.ini

          sudo loginctl enable-linger "${RDP_USERNAME}" || true
          sudo systemctl enable --now xrdp
          sudo chown -R "${RDP_USERNAME}:${RDP_USERNAME}" "${USER_HOME}"
          echo "Fast desktop/XRDP setup complete."

      - name: Tailscale up
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${TAILSCALE_AUTH_KEY:-}" ]] || { echo "::error::TAILSCALE_AUTH_KEY secret missing"; exit 1; }

          command -v tailscale >/dev/null 2>&1 || \
            timeout 180s bash -c 'curl -fsSL https://tailscale.com/install.sh | sh'
          sudo systemctl enable --now tailscaled

          for attempt in 1 2 3; do
            echo "Tailscale auth attempt ${attempt}/3..."
            sudo timeout 90s tailscale up \
              --auth-key="${TAILSCALE_AUTH_KEY}" \
              --hostname="ubuntu-gh-${GITHUB_RUN_ID}" \
              --accept-dns=false --timeout=75s && break
            sleep 5
          done || { echo "::error::Tailscale failed"; sudo tailscale status || true; exit 1; }

          TS_IP="$(sudo tailscale ip -4 | head -n1)"
          [[ -n "${TS_IP}" ]] || { echo "::error::No Tailscale IPv4"; exit 1; }
          echo "TAILSCALE_IP=${TS_IP}" >> "${GITHUB_ENV}"
          echo "${TS_IP}" | sudo tee "/home/${RDP_USERNAME}/TAILSCALE_IP.txt" >/dev/null

      # ==================================================================
      # PHASE 2 — Desktop tuning while RDP is already reachable
      # ==================================================================
      - name: Tune desktop for XRDP (low CPU)
        shell: bash
        run: |
          set -e
          USER_HOME="/home/${RDP_USERNAME}"
          CFG="${USER_HOME}/.config"
          AUTOSTART="${CFG}/autostart"
          sudo -u "${RDP_USERNAME}" mkdir -p "${AUTOSTART}"
          
          # --- XFCE: no screen blank/lock (worst RDP papercut), lighter compositor ---
          if [[ "${DESKTOP}" == "xfce" ]]; then
            # Clear stale/corrupt saved sessions (classic failsafe-session cause)
            sudo rm -rf "${USER_HOME}/.cache/sessions" 2>/dev/null || true
            sudo -u "${RDP_USERNAME}" bash -c "
              export HOME='${USER_HOME}'
              xfconf-query -c xfce4-power-manager -p /xfce4-power-manager/blank-on-ac --create -t int -s 0 2>/dev/null || true
              xfconf-query -c xfce4-power-manager -p /xfce4-power-manager/dpms-on-ac-timeout --create -t int -s 0 2>/dev/null || true
              xfconf-query -c xfce4-power-manager -p /xfce4-power-manager/lock-screen-suspend-hibernate --create -t bool -s false 2>/dev/null || true
              xfconf-query -c xfwm4 -p /general/sync_to_vblank --create -t bool -s false 2>/dev/null || true
            "
            printf '[Desktop Entry]\nHidden=true\nNoDisplay=true\n' | \
              sudo tee "${AUTOSTART}/xscreensaver.desktop" >/dev/null 2>/dev/null || true
            printf '#!/bin/sh\nxset s off\nxset dpms 0 0 0\nxset -dpms\n' | \
              sudo tee "${USER_HOME}/.xprofile" >/dev/null
            sudo chown "${RDP_USERNAME}:${RDP_USERNAME}" "${USER_HOME}/.xprofile"
          fi
          
          # --- GNOME: no animations/hot corners, kill tracker miners ---
          if [[ "${DESKTOP}" == "gnome-minimal" ]]; then
            sudo -u "${RDP_USERNAME}" dbus-run-session -- bash -c '
              gsettings set org.gnome.desktop.interface enable-animations false
              gsettings set org.gnome.desktop.interface enable-hot-corners false
              gsettings set org.gnome.desktop.wm.preferences button-layout ":close"
              gsettings set org.gnome.shell welcome-dialog-last-shown-version "$(gnome-shell --version | awk "{print \$3}")"
            ' || true
            for miner in tracker-miner-fs-3.desktop tracker-extract-3.desktop tracker-miner-rss-3.desktop; do
              printf '[Desktop Entry]\nHidden=true\nNoDisplay=true\n' | \
                sudo tee "${AUTOSTART}/${miner}" >/dev/null
            done
          fi
          
          sudo chown -R "${RDP_USERNAME}:${RDP_USERNAME}" "${CFG}"

      - name: Diagnose (brief)
        shell: bash
        run: |
          set +e
          sudo systemctl is-active xrdp && echo "XRDP: active" || echo "XRDP: NOT active"
          sudo ss -lnt | grep -q ':3389' && echo "TCP 3389: listening" || echo "TCP 3389: NOT listening"
          timeout 5 bash -c '</dev/tcp/127.0.0.1/3389' 2>/dev/null && echo "Local RDP probe: OK" || echo "Local RDP probe: FAIL"
          sudo tailscale status || true
          sudo journalctl -u xrdp --no-pager -n 25 || true

      - name: Connection info
        shell: bash
        run: |
          {
            echo "========================================"
            echo "       UBUNTU CLOUD PC READY"
            echo "========================================"
            echo "OS        : Ubuntu 24.04 (${DESKTOP})"
            echo "Remote    : XRDP port 3389"
            echo "Audio     : RDP audio redirection (PipeWire)"
            echo "User      : ${RDP_USERNAME}"
            echo "Tailscale : ${TAILSCALE_IP}"
            echo ""
            echo "RDP address:  ${TAILSCALE_IP}:3389"
            echo "Wine       : ${INSTALL_WINE} (background, non-blocking)"
            echo "D:         -> /home/${RDP_USERNAME}/D"
            echo "Persist    -> /home/${RDP_USERNAME}/${PERSIST_REL}"
            echo "========================================"
          } | tee "${GITHUB_STEP_SUMMARY}"

      # ==================================================================
      # PHASE 3 — Background extras (never blocks first RDP connect)
      # ==================================================================
      - name: Wine setup (background)
        if: ${{ env.INSTALL_WINE == 'true' }}
        shell: bash
        run: |
          set +e
          USER_HOME="/home/${RDP_USERNAME}"

          sudo tee /usr/local/bin/wine-setup.sh >/dev/null <<'EOF'
          #!/bin/bash
          set -x
          U="${RDP_USERNAME}"
          H="/home/${U}"
          WINEPREFIX="${H}/D/Wine"

          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            wine winetricks cabextract || exit 0

          sudo install -d -o "${U}" -g "${U}" "$WINEPREFIX"
          sudo -u "${U}" env HOME="${H}" WINEPREFIX="$WINEPREFIX" WINEDEBUG=-all \
            timeout 180s wineboot -u || true

          sudo ln -sfn "$WINEPREFIX" "${H}/.wine"
          sudo chown -h "${U}:${U}" "${H}/.wine"
          echo "Wine setup finished."
          EOF
          sudo chmod +x /usr/local/bin/wine-setup.sh

          setsid sudo -E /usr/local/bin/wine-setup.sh \
            > "${USER_HOME}/wine-setup.log" 2>&1 < /dev/null &
          disown || true
          echo "Wine setup started in background. Log: ${USER_HOME}/wine-setup.log"

      - name: Keep alive
        shell: bash
        run: |
          set -euo pipefail
          [[ "${MAX_HOURS}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::max-hours must be a positive integer"; exit 1; }

          MAX_SECONDS=$(( MAX_HOURS * 3600 ))
          START=$(date +%s)
          echo "Alive for up to ${MAX_HOURS}h. Touch STOP_WORKFLOW.txt to stop early."

          while true; do
            [[ -f STOP_WORKFLOW.txt ]] && { echo "Stop file detected."; break; }
            systemctl is-active --quiet xrdp || sudo systemctl restart xrdp || true
            NOW=$(date +%s)
            (( NOW - START >= MAX_SECONDS )) && { echo "Max runtime reached."; break; }
            echo "Alive: $(( (NOW - START) / 60 )) min"
            sleep 60
          done

      - name: Save session info
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p backup
          cp "/home/${RDP_USERNAME}/TAILSCALE_IP.txt" backup/ 2>/dev/null
          cp "/home/${RDP_USERNAME}/wine-setup.log" backup/ 2>/dev/null
          [[ -d "/home/${RDP_USERNAME}/${PERSIST_REL}" ]] && \
            tar -czf backup/persist.tar.gz -C "/home/${RDP_USERNAME}" "${PERSIST_REL}" 2>/dev/null
          dpkg-query -W -f='${binary:Package}\t${Version}\n' > backup/installed-packages.txt 2>/dev/null
          sudo tailscale status > backup/tailscale-status.txt 2>&1
          sudo systemctl status xrdp --no-pager > backup/xrdp-status.txt 2>&1
          ls -lh backup/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-cloud-pc-${{ github.run_id }}
          path: backup/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          sudo systemctl stop xrdp tailscaled 2>/dev/null || true
          exit 0
