name: Test Self-Hosted Runner

on:
  workflow_dispatch:          # รันมือได้จาก GitHub
  push:
    branches: [ main ]        # หรือ branch ที่คุณใช้ก็ได้

jobs:
  test:
    runs-on: self-hosted      # สำคัญมาก ต้องเป็น self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print system info
        run: |
          echo "===== Runner is alive! ====="
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Date: $(date)"
          echo "OS Info:"
          uname -a
          echo "Disk space:"
          df -h
          echo "===== Test completed successfully ====="

      - name: Simple success check
        run: |
          echo "If you see this message, the self-hosted runner is working correctly 💚"
          exit 0
