name: RDP with persistence

on:
  workflow_dispatch:
    inputs:
      persist-path:
        description: "Path on the runner to persist (relative to RDP user's profile). Default: Persist"
        required: false
        default: Persist

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_PERSIST_REL: ${{ github.event.inputs['persist-path'] || 'Persist' }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
      RDP_USERNAME: Winn_core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10 profile=any
          Restart-Service -Name TermService -Force
          Write-Host "RDP configured."

      - name: Install Pre-installed Apps (Steam, Discord, Windhawk, SecureUxTheme)
        shell: powershell
        run: |
          Write-Host "Installing pre-installed apps..."

          winget install --id Valve.Steam --accept-package-agreements --accept-source-agreements --silent
          winget install --id Discord.Discord --accept-package-agreements --accept-source-agreements --silent
          winget install RamenSoftware.Windhawk --accept-package-agreements --accept-source-agreements --silent
          winget install --id namazso.SecureUxTheme --accept-package-agreements --accept-source-agreements --silent

          Write-Host "All pre-installed apps installed successfully."

      - name: Install Windows 11 Dark Theme + DDLC Theme
        shell: powershell
        run: |
          Write-Host "Applying Windows 11 Dark Theme and DDLC Theme..."

          # Windows 11 Dark Theme
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name "AppsUseLightTheme" -Value 0 -Force
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name "SystemUsesLightTheme" -Value 0 -Force

          # Install DDLC Theme
          $themePath = "$env:GITHUB_WORKSPACE\ddlc theme v1.deskthemepack"
          if (Test-Path $themePath) {
              Write-Host "DDLC Theme file found in repository. Applying..."
              & "C:\Windows\Resources\Themes\ddlc theme v1.deskthemepack" apply $themePath
              Write-Host "DDLC theme applied successfully."
          } else {
              Write-Host "DDLC theme file not found in repository."
          }

          Write-Host "Theme installation completed."

      - name: Create RDP User
        shell: powershell
        run: |
          $username = "Winn_core"
          $password = "Elol..92"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $username -Password $securePass
          } else {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
              Add-LocalGroupMember -Group "Administrators" -Member $username
          }

          $profile = "C:\Users\$username"
          $persist = Join-Path $profile $env:RDP_PERSIST_REL
          New-Item -ItemType Directory -Path $persist -Force | Out-Null

      - name: Try restore previous backup
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          name: RDP-BACKUP-V*
          path: C:\restore-temp
          search_artifacts: true
          workflow_conclusion: completed

      - name: Restore files if backup exists
        shell: powershell
        run: |
          $restorePath = "C:\restore-temp"
          if (-not (Test-Path $restorePath) -or -not (Get-ChildItem $restorePath -ErrorAction SilentlyContinue)) {
              Write-Host "No previous backup found. Starting fresh."
              exit 0
          }

          Write-Host "Previous backup found. Restoring..."

          $mapping = @{
              "Persist"   = "C:\Users\Winn_core\Persist"
              "Desktop"   = "C:\Users\Winn_core\Desktop"
              "Documents" = "C:\Users\Winn_core\Documents"
              "Downloads" = "C:\Users\Winn_core\Downloads"
              "Pictures"  = "C:\Users\Winn_core\Pictures"
              "Videos"    = "C:\Users\Winn_core\Videos"
              "Music"     = "C:\Users\Winn_core\Music"
              "D_Drive"   = "D:\"
          }

          foreach ($key in $mapping.Keys) {
              $source = Join-Path $restorePath $key
              if (Test-Path $source) {
                  $dest = $mapping[$key]
                  New-Item -ItemType Directory -Path $dest -Force | Out-Null
                  Copy-Item -Path "$source\*" -Destination $dest -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host "Restored $key → $dest"
              }
          }

          Write-Host "Restore completed."

      - name: Install Tailscale via winget
        shell: powershell
        run: |
          Write-Host "Installing Tailscale via winget..."
          winget install --id Tailscale.Tailscale -e --accept-package-agreements --accept-source-agreements
          Write-Host "Tailscale installed via winget."

      - name: Establish Tailscale Connection (API Key)
        shell: powershell
        run: |
          if (-not $env:TAILSCALE_API_KEY) {
            Write-Error "TAILSCALE_API_KEY secret is missing. Please create a Tailscale API key in https://login.tailscale.com/admin/keys"
            exit 1
          }

          Start-Sleep -Seconds 5

          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            $exe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          }

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"
          & $exe up --authkey=$env:TAILSCALE_API_KEY --hostname=$hostname --accept-dns=false
          Start-Sleep -Seconds 10

          $tsIP = & $exe ip -4 | Select-Object -First 1
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $ip = $env:TAILSCALE_IP
          $test = Test-NetConnection -ComputerName $ip -Port 3389 -InformationLevel Detailed
          if (-not $test.TcpTestSucceeded) {
            Write-Error "RDP connection failed"
            exit 1
          }
          Write-Host "RDP reachable via Tailscale."

      - name: Maintain Connection + Smart Health Check
        shell: powershell
        run: |
          $persistDir = "C:\Users\Winn_core\$env:RDP_PERSIST_REL"
          $stopFile = Join-Path $persistDir 'STOP_WORKFLOW.txt'
          $failCount = 0
          $maxFails = 3

          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "IP       : $env:TAILSCALE_IP"
          Write-Host "Username : Winn_core"
          Write-Host "Password : Elol..92"
          Write-Host "Persist  : $persistDir"
          Write-Host "==================`n"

          while ($true) {
              if (Test-Path $stopFile) {
                  Write-Host "STOP_WORKFLOW.txt detected. Stopping..."
                  break
              }

              # === Smart Health Check using Tailscale status ===
              Write-Host "Checking Tailscale connection..."

              try {
                  $tsStatus = & "C:\Program Files\Tailscale\tailscale.exe" status

                  if ($tsStatus -match "Connected") {
                      # Tailscale is connected
                      $rdpTest = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue

                      if ($rdpTest.TcpTestSucceeded) {
                          $failCount = 0
                          Write-Host "[$(Get-Date -Format o)] Tailscale + RDP both healthy..."
                      } else {
                          $failCount++
                          Write-Host "[$(Get-Date -Format o)] RDP connection lost (fail $failCount/$maxFails)"
                      }
                  } else {
                      # Tailscale is disconnected
                      $failCount++
                      Write-Host "[$(Get-Date -Format o)] Tailscale connection lost (fail $failCount/$maxFails)"
                  }
              }
              catch {
                  $failCount++
                  Write-Host "[$(Get-Date -Format o)] Health check failed: $_"
              }

              if ($failCount -ge $maxFails) {
                  Write-Host "=== RDP/Tailscale DEAD - Auto stopping ==="
                  "Cloud PC became unreachable - auto stopped" | Out-File (Join-Path $persistDir "AUTO_STOPPED.txt")
                  break
              }

              Start-Sleep -Seconds 60
          }

      - name: Prepare backup folders
        if: always()
        shell: powershell
        run: |
          $backupRoot = "C:\backup-temp"
          New-Item -ItemType Directory -Path $backupRoot -Force | Out-Null

          $folders = @{
              "Persist"   = "C:\Users\Winn_core\Persist"
              "Desktop"   = "C:\Users\Winn_core\Desktop"
              "Documents" = "C:\Users\Winn_core\Documents"
              "Downloads" = "C:\Users\Winn_core\Downloads"
              "Pictures"  = "C:\Users\Winn_core\Pictures"
              "Videos"    = "C:\Users\Winn_core\Videos"
              "Music"     = "C:\Users\Winn_core\Music"
          }

          foreach ($name in $folders.Keys) {
              $source = $folders[$name]
              if (Test-Path $source) {
                  Copy-Item -Path $source -Destination "$backupRoot\$name" -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host "Backed up $name"
              }
          }

          $dDriveBackup = Join-Path $backupRoot "D_Drive"
          New-Item -ItemType Directory -Path $dDriveBackup -Force | Out-Null

          $defaultNames = @(
              "a", "Actions", "Temp", "tmp", "Windows", "ProgramData",
              "Recovery", "System Volume Information", "`$Recycle.Bin",
              "pagefile.sys", "swapfile.sys", "hiberfil.sys"
          )

          if (Test-Path "D:\") {
              Write-Host "Scanning D: drive for user files..."
              Get-ChildItem -Path "D:\" -Force -ErrorAction SilentlyContinue | ForEach-Object {
                  $itemName = $_.Name
                  if ($defaultNames -contains $itemName) {
                      Write-Host "Skipping default item: $itemName"
                      return
                  }
                  try {
                      Copy-Item -Path $_.FullName -Destination $dDriveBackup -Recurse -Force -ErrorAction Stop
                      Write-Host "Backed up from D:: $itemName"
                  }
                  catch {
                      Write-Host "Failed to backup $itemName : $_"
                  }
              }
          }

      - name: Upload persisted data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RDP-BACKUP-V${{ github.run_number }}
          path: C:\backup-temp
          if-no-files-found: warn
