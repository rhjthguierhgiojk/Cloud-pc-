name: RDP with persistence and Dropbox upload

on:
  workflow_dispatch:
    inputs:
      persist-path:
        description: "Path on the runner to persist (relative to RDP user's profile). Default: Persist"
        required: false
        default: Persist

jobs:
  secure-rdp:
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 1440

    env:
      RDP_PERSIST_REL: ${{ github.event.inputs["persist-path"] || 'Persist' }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10 profile=any
          Restart-Service -Name TermService -Force
          Write-Host "RDP configured."

      - name: Create RDP User
        shell: powershell
        run: |
          $username = "Winn_core"
          $password = "Elol..92"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContin
