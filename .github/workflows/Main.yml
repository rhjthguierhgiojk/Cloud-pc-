name: RDP with persistence

on:
  workflow_dispatch:
    inputs:
      persist-path:
        description: "Path on the runner to persist (relative to RDP user's profile). Default: Persist"
        required: false
        default: Persist

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_PERSIST_REL: ${{ github.event.inputs['persist-path'] || 'Persist' }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_USERNAME: Winn_core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10 profile=any
          Restart-Service -Name TermService -Force
          Write-Host "RDP configured."

      - name: Create RDP User
        shell: powershell
        run: |
          $username = "Winn_core"
          $password = "Elol..92"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $username -Password $securePass
          } else {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
              Add-LocalGroupMember -Group "Administrators" -Member $username
          }

          $profile = "C:\Users\$username"
          $persist = Join-Path $profile $env:RDP_PERSIST_REL
          New-Item -ItemType Directory -Path $persist -Force | Out-Null

      - name: Try restore previous backup
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: RDP-BACKUP-VM-*
          path: C:\restore-temp
          merge-multiple: true

      - name: Restore files if backup exists
        shell: powershell
        run: |
          $restorePath = "C:\restore-temp"
          if (-not (Test-Path $restorePath) -or -not (Get-ChildItem $restorePath -ErrorAction SilentlyContinue)) {
              Write-Host "No previous backup found. Starting fresh."
              exit 0
          }

          Write-Host "Previous backup(s) found. Looking for the newest one..."

          $backups = Get-ChildItem -Path $restorePath -Directory -ErrorAction SilentlyContinue
          if (-not $backups) {
              $sourceRoot = $restorePath
          } else {
              $newest = $backups | Sort-Object Name -Descending | Select-Object -First 1
              $sourceRoot = $newest.FullName
              Write-Host "Using backup: $($newest.Name)"
          }

          $mapping = @{
              "Persist"   = "C:\Users\Winn_core\Persist"
              "Desktop"   = "C:\Users\Winn_core\Desktop"
              "Documents" = "C:\Users\Winn_core\Documents"
              "Downloads" = "C:\Users\Winn_core\Downloads"
              "Pictures"  = "C:\Users\Winn_core\Pictures"
              "Videos"    = "C:\Users\Winn_core\Videos"
              "Music"     = "C:\Users\Winn_core\Music"
              "D_Drive"   = "D:\"
          }

          foreach ($key in $mapping.Keys) {
              $source = Join-Path $sourceRoot $key
              if (Test-Path $source) {
                  $dest = $mapping[$key]
                  New-Item -ItemType Directory -Path $dest -Force | Out-Null
                  Copy-Item -Path "$source\*" -Destination $dest -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host "Restored $key → $dest"
              }
          }

          Write-Host "Restore completed."

      - name: Install Tailscale via winget
        shell: powershell
        run: |
          Write-Host "Installing Tailscale via winget..."
          winget install --id Tailscale.Tailscale -e --accept-package-agreements --accept-source-agreements
          Write-Host "Tailscale installed via winget."

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) {
            Write-Error "TAILSCALE_AUTH_KEY secret missing"
            exit 1
          }

          Start-Sleep -Seconds 5

          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            $exe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          }

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"
          & $exe up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=$hostname
          Start-Sleep -Seconds 10

          $tsIP = & $exe ip -4 | Select-Object -First 1
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $ip = $env:TAILSCALE_IP
          $test = Test-NetConnection -ComputerName $ip -Port 3389 -InformationLevel Detailed
          if (-not $test.TcpTestSucceeded) {
            Write-Error "TCP connection failed"
            exit 1
          }
          Write-Host "RDP reachable via Tailscale."

      - name: Maintain Connection + Health Check
        shell: powershell
        run: |
          $persistDir = "C:\Users\Winn_core\$env:RDP_PERSIST_REL"
          $stopFile = Join-Path $persistDir 'STOP_WORKFLOW.txt'
          $failCount = 0
          $maxFails = 3

          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "IP       : $env:TAILSCALE_IP"
          Write-Host "Username : Winn_core"
          Write-Host "Password : Elol..92"
          Write-Host "Persist  : $persistDir"
          Write-Host "==================`n"

          while ($true) {
              if (Test-Path $stopFile) {
                  Write-Host "STOP_WORKFLOW.txt detected. Stopping..."
                  break
              }

              $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue

              if ($test.TcpTestSucceeded) {
                  $failCount = 0
                  Write-Host "[$(Get-Date -Format o)] RDP is healthy..."
              }
              else {
                  $failCount++
                  Write-Host "[$(Get-Date -Format o)] RDP unreachable (fail $failCount/$maxFails)"

                  Write-Host "Attempting recovery..."
                  try {
                      $apps = @("chrome", "msedge", "firefox", "code", "devenv", "GameBar", "SearchApp", "OneDrive")
                      foreach ($app in $apps) {
                          Get-Process -Name $app -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
                      }
                      Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
                      Start-Sleep -Seconds 5
                  }
                  catch {
                      Write-Host "Recovery attempt failed: $_"
                  }

                  if ($failCount -ge $maxFails) {
                      Write-Host "RDP still dead after recovery attempts. Auto stopping..."
                      "Cloud PC became unreachable - auto stopped" | Out-File (Join-Path $persistDir "AUTO_STOPPED.txt")
                      break
                  }
              }

              Start-Sleep -Seconds 120
          }

      - name: Prepare backup folders
        if: always()
        shell: powershell
        run: |
          $backupRoot = "C:\backup-temp"
          New-Item -ItemType Directory -Path $backupRoot -Force | Out-Null

          # Normal user folders
          $folders = @{
              "Persist"   = "C:\Users\Winn_core\Persist"
              "Desktop"   = "C:\Users\Winn_core\Desktop"
              "Documents" = "C:\Users\Winn_core\Documents"
              "Downloads" = "C:\Users\Winn_core\Downloads"
              "Pictures"  = "C:\Users\Winn_core\Pictures"
              "Videos"    = "C:\Users\Winn_core\Videos"
              "Music"     = "C:\Users\Winn_core\Music"
          }

          foreach ($name in $folders.Keys) {
              $source = $folders[$name]
              if (Test-Path $source) {
                  Copy-Item -Path $source -Destination "$backupRoot\$name" -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host "Backed up $name"
              }
          }

          # Smart backup for D: drive (only user-created items)
          $dDriveBackup = Join-Path $backupRoot "D_Drive"
          New-Item -ItemType Directory -Path $dDriveBackup -Force | Out-Null

          $defaultNames = @(
              "a", "Actions", "Temp", "tmp", "Windows", "ProgramData",
              "Recovery", "System Volume Information", "`$Recycle.Bin",
              "pagefile.sys", "swapfile.sys", "hiberfil.sys"
          )

          if (Test-Path "D:\") {
              Write-Host "Scanning D: drive for user files..."
              Get-ChildItem -Path "D:\" -Force -ErrorAction SilentlyContinue | ForEach-Object {
                  $itemName = $_.Name

                  if ($defaultNames -contains $itemName) {
                      Write-Host "Skipping default item: $itemName"
                      return
                  }

                  try {
                      Copy-Item -Path $_.FullName -Destination $dDriveBackup -Recurse -Force -ErrorAction Stop
                      Write-Host "Backed up from D:: $itemName"
                  }
                  catch {
                      Write-Host "Failed to backup $itemName : $_"
                  }
              }
          } else {
              Write-Host "D: drive not found"
          }

      - name: Upload persisted data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RDP-BACKUP-VM-\( {{ github.run_id }}- \){{ github.run_attempt }}
          path: C:\backup-temp
          if-no-files-found: warn
