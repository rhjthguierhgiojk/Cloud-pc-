# snippet to insert in your existing job steps (Windows runner)
- name: Set up Python
  uses: actions/setup-python@v4
  with:
    python-version: "3.10"

- name: Install Dropbox SDK
  shell: powershell
  run: |
    python -m pip install --upgrade pip
    pip install dropbox

- name: Upload persisted folder to Dropbox (Python)
  shell: powershell
  env:
    DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
    RDP_USERNAME: ${{ env.RDP_USERNAME }}
    RDP_PERSIST_REL: ${{ env.RDP_PERSIST_REL }}
    GITHUB_RUN_ID: ${{ github.run_id }}
  run: |
    # Ensure script exists in repo or create it on the fly. Example: run the script from .github/scripts/upload_dropbox.py
    python .github/scripts/upload_dropbox.py
